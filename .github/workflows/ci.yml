name: Integración Continua (CI/CD) 🚀

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Descargar el código 📥
        uses: actions/checkout@v4

      - name: Configurar Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias y ejecutar tests 🧪
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          PYTHONPATH=. pytest app/test_main.py

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: "Authenticate to Google Cloud via WIF"
        uses: "google-github-actions/auth@v2"
        with:
          workload_identity_provider: "${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}"
          service_account: "${{ secrets.GCP_SERVICE_ACCOUNT }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"

      - name: Validar sintaxis de Terraform 🛠️
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"

      - name: Chequeo de Terraform Init & Validate 🔍
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Configurar Docker para Artifact Registry 📦
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Construir y etiquetar imagen Docker 🏗️
        run: |
          docker build -t us-central1-docker.pkg.dev/laboratorio-terraform-508817/flask-repo/app:latest ./app

      - name: Subir imagen a Artifact Registry 🚀
        run: |
          docker push us-central1-docker.pkg.dev/laboratorio-terraform-508817/flask-repo/app:latest

      - name: Desplegar en Cloud Run ☁️
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: flask-app
          image: us-central1-docker.pkg.dev/laboratorio-terraform-508817/flask-repo/app:latest
          region: us-central1
